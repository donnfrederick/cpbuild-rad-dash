# When the CI workflow fails on a PR targeting dev (from a human author),
# automatically post a comment that triggers the Copilot SWE agent to analyze
# the failures and open a fix PR.
#
# Guards against:
# - Infinite loops — bot-authored PRs (Copilot SWE agent, Dependabot, GitHub
#   Actions) are skipped so fix chains cannot form.
# - Duplicate comments — the label "copilot-ci-fix-requested" is applied on the
#   first fix request. Subsequent CI reruns (or intermittent failures) find the
#   label and skip posting again. Remove the label to re-arm after a manual fix.

name: Auto-Fix CI Failures
run-name: "Auto-fix CI — ${{ github.event.workflow_run.conclusion }} on ${{ github.event.workflow_run.head_branch }}"

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  request-fix:
    name: Request Copilot Fix
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Find open PR targeting dev for this workflow run
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EVENT_PATH="${GITHUB_EVENT_PATH}"

          # Use the PR information from the workflow_run payload directly to avoid
          # relying on matching head SHAs, which can change if new commits are pushed.
          PR_NUMBER=$(jq -r '.workflow_run.pull_requests[0].number // 0' "$EVENT_PATH")
          BASE_REF=$(jq -r '.workflow_run.pull_requests[0].base.ref // ""' "$EVENT_PATH")

          if [[ "$PR_NUMBER" == "0" ]]; then
            echo "No pull_requests entry found on this workflow_run event; skipping."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BASE_REF" != "dev" ]]; then
            echo "PR #$PR_NUMBER targets '$BASE_REF', not 'dev'; skipping."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_DATA=$(gh pr view "$PR_NUMBER" \
            --repo "${{ github.repository }}" \
            --json author,labels)

          AUTHOR=$(echo "$PR_DATA" | jq -r '.author.login')
          HAS_FIX_LABEL=$(echo "$PR_DATA" | jq '[.labels[].name] | contains(["copilot-ci-fix-requested"])')

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "has_fix_label=$HAS_FIX_LABEL" >> "$GITHUB_OUTPUT"
          echo "Found PR #$PR_NUMBER targeting dev authored by $AUTHOR (has_fix_label=$HAS_FIX_LABEL)"

      - name: Post Copilot fix request
        # Skip bot-authored PRs and PRs that already have a fix requested
        # (idempotency: label is set after first request; remove to re-arm).
        if: |
          steps.find-pr.outputs.pr_number != '' &&
          steps.find-pr.outputs.author != 'copilot-swe-agent' &&
          steps.find-pr.outputs.author != 'dependabot[bot]' &&
          steps.find-pr.outputs.author != 'github-actions[bot]' &&
          steps.find-pr.outputs.has_fix_label != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ steps.find-pr.outputs.pr_number }}"

          BRANCH=$(gh pr view "$PR" \
            --repo "${{ github.repository }}" \
            --json headRefName \
            --jq '.headRefName')

          gh pr comment "$PR" \
            --repo "${{ github.repository }}" \
            --body "@copilot The CI checks are failing on this PR. Please analyze the failures and create a **single PR** with fixes targeting the \`${BRANCH}\` branch."

          # Label the PR so reruns don't post another comment.
          gh label create "copilot-ci-fix-requested" \
            --color "e4e669" \
            --description "Copilot has been asked to fix CI failures on this PR" \
            --repo "${{ github.repository }}" 2>/dev/null || true
          gh pr edit "$PR" \
            --repo "${{ github.repository }}" \
            --add-label "copilot-ci-fix-requested"

