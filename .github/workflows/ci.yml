name: CI
run-name: "CI — PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  # Disable Prisma checkpoint telemetry (avoids firewall block in CI/Copilot)
  CHECKPOINT_DISABLE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run unit tests
        run: npm run test:unit
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
          AUTH_SECRET: "ci-test-secret"
          NEXTAUTH_URL: "http://localhost:3000"
          VITEST_SILENT_API: "1"

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?schema=public"
          AUTH_SECRET: "ci-test-secret"
          NEXTAUTH_URL: "http://localhost:3000"
          VITEST_SILENT_API: "1"

  # Gate job for branch protection (requires "lint-and-test" status)
  lint-and-test:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests]
    steps:
      - run: echo "All checks passed"
