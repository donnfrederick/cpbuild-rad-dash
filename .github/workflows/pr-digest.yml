name: PR Digest
run-name: "PR Digest — ${{ github.event_name == 'schedule' && 'weekly' || format('manual ({0}d)', inputs.days) }}"

# Posts a digest of merged PRs as a GitHub Issue.
# Default: weekly on Monday at 9 AM UTC.
# Adjust cron when team cadence changes (start weekly, move to 2-3x/week as team scales).
#
# To run on-demand: Actions → PR Digest → Run workflow.

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to look (default: 7)'
        default: '7'
        required: false

permissions:
  issues: write
  pull-requests: read

jobs:
  digest:
    name: Generate PR digest
    runs-on: ubuntu-latest

    steps:
      - name: Build and post digest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ github.event.inputs.days || '7' }}
        run: |
          SINCE=$(date -u -d "-${DAYS} days" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
            || date -u -v-${DAYS}d '+%Y-%m-%dT%H:%M:%SZ')

          MERGED=$(gh pr list \
            --repo "$REPO" \
            --state merged \
            --search "merged:>=${SINCE}" \
            --json number,title,author,mergedAt,labels,url \
            --jq 'sort_by(.mergedAt) | reverse | .[]')

          COUNT=$(echo "$MERGED" | jq -s 'length')
          TODAY=$(date -u '+%Y-%m-%d')
          PERIOD_LABEL="${DAYS}-day"

          if [ "$COUNT" -eq 0 ]; then
            BODY=$(printf '## PR Digest — %s\n\n_No PRs merged in the last %s days._\n\n---\n_Auto-generated by the PR Digest workflow. Adjust cadence in `.github/workflows/pr-digest.yml`._' \
              "$TODAY" "$DAYS")
          else
            # Build table rows
            ROWS=""
            while IFS= read -r pr; do
              NUM=$(echo "$pr" | jq -r '.number')
              TITLE=$(echo "$pr" | jq -r '.title')
              AUTHOR=$(echo "$pr" | jq -r '.author.login')
              MERGED_AT=$(echo "$pr" | jq -r '.mergedAt' | cut -c1-10)
              PR_URL=$(echo "$pr" | jq -r '.url')
              LABEL_STR=$(echo "$pr" | jq -r '[.labels[].name] | join(", ")' | head -c 60)
              ROWS="${ROWS}| [#${NUM}](${PR_URL}) | ${TITLE} | @${AUTHOR} | ${MERGED_AT} | ${LABEL_STR} |\n"
            done <<< "$(echo "$MERGED" | jq -c '.')"

            TABLE=$(printf '| PR | Title | Author | Merged | Labels |\n|----|-------|--------|--------|--------|\n%b' "$ROWS")

            BODY=$(printf '## PR Digest — %s\n\n**%s PRs merged in the last %s days**\n\n%s\n\n---\n_Auto-generated by the PR Digest workflow. Adjust cadence in `.github/workflows/pr-digest.yml`._' \
              "$TODAY" "$COUNT" "$DAYS" "$TABLE")
          fi

          # Check if an open digest issue already exists for this week
          EXISTING=$(gh issue list \
            --repo "$REPO" \
            --label "pr-digest" \
            --state open \
            --json number,title \
            --jq "[.[] | select(.title | startswith(\"PR Digest —\"))] | .[0].number // empty")

          # Ensure label exists
          gh label create "pr-digest" \
            --color "0075ca" \
            --description "Auto-generated PR activity digest" \
            --repo "$REPO" 2>/dev/null || true

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" \
              --repo "$REPO" \
              --title "PR Digest — ${TODAY} (last ${PERIOD_LABEL})" \
              --body "$BODY" 2>/dev/null || true
            echo "Updated existing digest issue #${EXISTING}"
          else
            gh issue create \
              --repo "$REPO" \
              --title "PR Digest — ${TODAY} (last ${PERIOD_LABEL})" \
              --body "$BODY" \
              --label "pr-digest" 2>/dev/null || true
            echo "Created new digest issue"
          fi
